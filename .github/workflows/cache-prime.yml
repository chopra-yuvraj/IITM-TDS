name: Combined Requirements Workflow

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  combined-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: 24f2002642@ds.study.iitm.ac.in
        run: echo "Hello, world! Email step completed successfully."
        
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Cache Python dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: cache-53a55a9
          
      - name: prime-cache-53a55a9
        run: |
          if [ "${{ steps.cache-deps.outputs.cache-hit }}" == "true" ]; then
            echo "Cache hit: true"
          else
            echo "Cache hit: false"
          fi
          
      - name: Install dependencies to populate cache
        run: |
          pip install requests numpy pandas
          
      - name: Verify both requirements
        run: |
          echo "✅ Email step: 24f2002642@ds.study.iitm.ac.in - COMPLETED"
          echo "✅ Cache step: prime-cache-53a55a9 - COMPLETED"
          echo "✅ Cache key: cache-53a55a9 - USED"
          echo "✅ Actions cache v4 - USED"
          echo "Both requirements satisfied in single workflow!"
