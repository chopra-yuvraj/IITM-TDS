name: Cache Workflow

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  cache-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Cache Python dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: cache-53a55a9
          
      - name: prime-cache-53a55a9
        run: |
          if [ "${{ steps.cache-deps.outputs.cache-hit }}" == "true" ]; then
            echo "Cache hit: true"
          else
            echo "Cache hit: false"
          fi
          
      - name: Install dependencies
        run: |
          pip install requests numpy
        
      - name: Verify cache functionality
        run: echo "Cache workflow completed successfully"
